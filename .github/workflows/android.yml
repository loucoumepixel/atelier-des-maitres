name: Android

on:
  # Les branches de travail sont construites par leur pull request : pas de double build.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Une nouvelle poussée annule le build en cours de la même branche (sauf main, qui publie).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Le parcours du joueur sur un téléphone virtuel : chaque toile s'ouvre et se peint, chaque
  # écran s'affiche. Aucune version n'est publiée si ce parcours échoue.
  parcours:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accélérer le téléphone virtuel
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compiler l'application et ses tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Jouer le parcours sur un téléphone virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest
      # Le détail des échecs (avec la pile d'appels) directement dans le journal.
      - name: Montrer les échecs du parcours
        if: failure()
        run: |
          for f in $(find app/build/outputs/androidTest-results -name '*.xml'); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).iter('testcase'):
              for failure in case.findall('failure'):
                  print('=' * 20, case.get('classname'), case.get('name'))
                  print('\n'.join((failure.text or '').splitlines()[:60]))
          PY
          done
      - name: Garder le rapport du parcours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-parcours
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  build:
    needs: parcours
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Clé d'envoi Play Store, si les secrets sont configurés (voir docs/play-store/README.md).
      - name: Préparer la clé d'envoi
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      # Une version publiée signée avec la clé de debug serait refusée par la Play Console
      # et ne pourrait pas mettre à jour l'application installée : on s'arrête net.
      - name: Exiger la clé d'envoi pour publier
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets UPLOAD_KEYSTORE_BASE64 / UPLOAD_KEYSTORE_PASSWORD absents : voir docs/play-store/README.md"
            exit 1
          fi
      - name: Tests du moteur, APK et bundle Play Store
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease :app:bundleRelease
      - name: Nommer les fichiers
        run: |
          cp app/build/outputs/apk/release/app-release.apk atelier-des-maitres.apk
          cp app/build/outputs/bundle/release/app-release.aab atelier-des-maitres.aab
          cp app/build/outputs/mapping/release/mapping.txt atelier-des-maitres-mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-des-maitres-apk
          path: atelier-des-maitres.apk
      # Le bundle .aab est le format à déposer sur la Play Console.
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-des-maitres-play-store
          path: |
            atelier-des-maitres.aab
            atelier-des-maitres-mapping.txt
      # Chaque version de main est publiée en Release : l'APK se télécharge alors
      # directement depuis un téléphone, sans compte ni zip.
      - name: Publier la Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            atelier-des-maitres.apk atelier-des-maitres.aab atelier-des-maitres-mapping.txt \
            --title "Atelier des Maîtres 1.0.${{ github.run_number }}" \
            --notes "Téléchargez atelier-des-maitres.apk depuis votre téléphone Android et ouvrez-le pour l'installer. Le fichier .aab est destiné à la Play Console ; atelier-des-maitres-mapping.txt s'y dépose avec lui (Explorateur d'App Bundle › Téléchargements › Fichier de désobscurcissement) pour des rapports de plantage lisibles." \
            --generate-notes \
            --latest
